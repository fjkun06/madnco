<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MadnCo. · Gaming (vertical)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Rubik:wght@400;500;700&amp;family=JetBrains+Mono:wght@700;800&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>

.sc{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;color:#F4EFE6;font-family:Rubik,system-ui,sans-serif}
.sc *{box-sizing:border-box}
.dots{position:absolute;inset:0;background-image:radial-gradient(#2a1a20 1.5px,transparent 1.6px);background-size:32px 32px}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.disp{font-family:'Lilita One',Rubik,sans-serif;font-weight:400}
.cut-s{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.br{position:absolute;width:52px;height:52px;border:0 solid #30D5C8}
.ld{width:10px;height:10px;border-radius:50%;background:#110A0C;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.4}}
.tape{position:absolute;left:-80px;right:-80px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.track{display:inline-flex;animation:tick 26s linear infinite}
.track span{font-family:'Lilita One',sans-serif;padding:0 22px}
.track i{font-style:normal;font-family:'JetBrains Mono',monospace;font-weight:800;opacity:.55}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>

<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}.sc{transform-origin:0 0}.bgwrap{position:absolute;inset:0;overflow:hidden;background:#110A0C;-webkit-mask-image:linear-gradient(#000,#000),linear-gradient(#000,#000),linear-gradient(#000,#000);mask-image:linear-gradient(#000,#000),linear-gradient(#000,#000),linear-gradient(#000,#000);-webkit-mask-size:100% 100%,1080px 608px,1080px 608px;mask-size:100% 100%,1080px 608px,1080px 608px;-webkit-mask-position:0 0,0px 210px,0px 902px;mask-position:0 0,0px 210px,0px 902px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-composite:xor;mask-composite:exclude}[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="/overlay/play.css">
<link rel="stylesheet" href="/overlay/plate.css">
<link rel="stylesheet" href="/overlay/guest.css">
<link rel="stylesheet" href="/overlay/alerts.css">
<style>
/* Vertical nameplate: a full-width strip between cam and game, the goal under the game. */
.vstrip{position:absolute;left:0;right:0;top:818px;height:84px;background:#1B1014;border-top:4px solid var(--a);flex-direction:row;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 40px;animation:none}
.vstrip .np-meta{font-size:22px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.vstrip .ct b{font-size:56px}.vstrip .ct small{font-size:22px}.vstrip .ct .sk{width:42px;height:42px}.vstrip .ct .lb{font-size:16px}
.vstrip .ct.two b{font-size:40px}
.vstrip .fbs .r b{font-size:46px}.vstrip .fbs .r span{font-size:18px}.vstrip .fbs .gl{font-size:40px}
.vgoal{position:absolute;left:40px;right:40px;top:1530px;border-left:6px solid var(--a);padding:4px 0 4px 22px}
.vgoal .np-head{font-size:46px;line-height:1.05}
html[data-head="m"] .vgoal .np-head{font-size:42px}
html[data-head="l"] .vgoal .np-head{font-size:34px}
.vcam{position:absolute;left:0;top:210px;width:1080px;height:608px}
.vlogo{position:absolute;right:22px;top:18px;width:130px;height:auto;opacity:.75}
</style>
</head><body>

<div class="sc">
  <div class="bgwrap" aria-hidden="true"></div>

  <!-- 0–210: TikTok's header covers this. Cam full width under it. -->
  <div class="vcam"><span class="camfx"></span><span class="rec mono">● REC</span>
    <img class="vlogo" src="/overlay/logo-flat.png" alt="MadnCo. logo"></div>

  <div class="vstrip np" hidden data-show="play">
    <div class="np-meta mono">
      <span class="mi" hidden data-show="play-title" data-text="play-short"></span>
      <span class="mi" hidden data-show="play-part"><span data-text="play-unit"></span> <b data-text="play-part-n"></b></span>
      <span class="co" hidden data-show="co">w/ <span data-text="co-name"></span></span>
      <span class="fin" hidden data-show="play-final">Final</span>
    </div>
    <div class="np-stat">
      <div class="ct" hidden data-show="play-c1-on">
        <span class="skw" hidden data-show="play-c1-skull"><svg class="sk" viewBox="0 0 24 24" aria-hidden="true"><path class="b" d="M12 2C7 2 3.5 5.6 3.5 10.2c0 2.6 1.1 4.4 2.7 5.6V19c0 .8.6 1.4 1.4 1.4h1.1v-2h1.5v2h3.6v-2h1.5v2h1.1c.8 0 1.4-.6 1.4-1.4v-3.2c1.6-1.2 2.7-3 2.7-5.6C20.5 5.6 17 2 12 2z"/><circle cx="8.8" cy="10.6" r="2.3" fill="#110A0C"/><circle cx="15.2" cy="10.6" r="2.3" fill="#110A0C"/><path d="M12 13.2l-1.3 2.2h2.6z" fill="#110A0C"/></svg></span>
        <span class="lb mono" hidden data-show="play-c1-named" data-text="play-c1-label"></span>
        <b data-text="play-c1-n" data-pop>0</b><small data-text="play-c1-of"></small>
      </div>
      <div class="ct two" hidden data-show="play-c2-on">
        <span class="lb mono" data-text="play-c2-label"></span>
        <b data-text="play-c2-n" data-pop>0</b><small data-text="play-c2-of"></small>
      </div>
      <div class="fbs" hidden data-show="play-football">
        <span class="r" hidden data-show="fb-record-on"><span class="mono" style="color: var(--a)">W</span><b data-text="fb-w" data-pop>0</b></span>
        <span class="r" hidden data-show="fb-record-on"><span class="mono" style="color: #BBAAB1">D</span><b data-text="fb-d" data-pop>0</b></span>
        <span class="r" hidden data-show="fb-record-on"><span class="mono" style="color: var(--b)">L</span><b data-text="fb-l" data-pop>0</b></span>
        <span class="gl" hidden data-show="fb-goals-on" data-text="fb-goals">0:0</span>
      </div>
    </div>
  </div>
  <div class="vstrip np" hidden data-show="game-only">
    <div class="np-meta mono"><span class="mi">Now playing</span><span class="mi" style="color: #F4EFE6" data-text="game"></span><span class="co" hidden data-show="co">w/ <span data-text="co-name"></span></span></div>
  </div>

  <!-- 902–1510: the game, full width. -->

  <div class="vgoal" hidden data-show="play-goal-on"><div class="np-head" data-text="play-goal"></div></div>

  <div hidden data-show="play-poll" style="position: absolute; right: 24px; top: 924px; transform: scale(.82); transform-origin: 100% 0">
      <div class="poll cut">
        <div class="h mono"><span>Chat decides · type !1 !2</span><span data-text="poll-votes">0 votes</span></div>
        <div class="q disp" data-text="poll-q"></div>
        <div class="opts">
          <div class="o" hidden data-show="poll-o1" data-lead="1"><div class="f" data-bar="poll-1"></div><span class="mono" data-text="poll-t1"></span></div>
          <div class="o" hidden data-show="poll-o2" data-lead="2"><div class="f" data-bar="poll-2"></div><span class="mono" data-text="poll-t2"></span></div>
          <div class="o" hidden data-show="poll-o3" data-lead="3"><div class="f" data-bar="poll-3"></div><span class="mono" data-text="poll-t3"></span></div>
          <div class="o" hidden data-show="poll-o4" data-lead="4"><div class="f" data-bar="poll-4"></div><span class="mono" data-text="poll-t4"></span></div>
        </div>
      </div>
  </div>

  <!-- Ticker (off by default on Gaming): just under the goal. -->
  <div class="tape vtape" hidden data-show="ticker-gaming" aria-hidden="true" style="top: 1636px; height: 56px; background: #30D5C8; color: #110A0C; transform: rotate(-1.5deg)">
    <div class="track" data-ticker="gaming" data-upper>
      <span style="font-size: 28px">FOLLOW @MADNCO8</span><i style="font-size: 20px">//</i><span style="font-size: 28px">MADNESS LOVES COMPANY</span><i style="font-size: 20px">//</i>
    </div>
  </div>

  <div class="pinned cut" hidden data-show="guest" style="top: 1720px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px"><span class="mono" style="font-size: 14px">Pinned · borrowed channel</span>
      <span class="t disp">Follow @madnco8: <span data-text="quest-left">23</span> more and we go LIVE at home</span></div>
    <span class="ar cut-s"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
  </div>
  <div id="alert-lane" class="alane v" aria-live="polite" style="left: 40px; right: 40px; top: 1520px"></div>
</div>

<script>(function(){var W=1080,H=1920;function fit(){var s=document.querySelector('.sc');var k=Math.min(innerWidth/W,innerHeight/H);s.style.transform='scale('+k+')';}addEventListener('resize',fit);fit();})();</script>
<script src="/overlay/live.js" defer></script>
</body></html>
