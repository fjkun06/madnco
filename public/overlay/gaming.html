<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MadnCo. · /home/claude/export/MadnCo OBS Overlays/landscape/gaming-overlay.html</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Rubik:wght@400;500;700&amp;family=JetBrains+Mono:wght@700;800&amp;display=swap" rel="stylesheet">
<style>

.sc{position:relative;width:1920px;height:1080px;overflow:hidden;color:#F4EFE6;font-family:Rubik,system-ui,sans-serif}
.sc *{box-sizing:border-box}
.game{position:absolute;inset:0;background:linear-gradient(160deg,#3a4250 0%,#262b33 55%,#1c1f25 100%);display:flex;align-items:center;justify-content:center}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.disp{font-family:'Lilita One',Rubik,sans-serif;font-weight:400}
.cut{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.cut-s{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.br{position:absolute;width:44px;height:44px;border:0 solid #30D5C8}
.ld{width:10px;height:10px;border-radius:50%;background:#110A0C;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.4}}
.follow{animation:peek 20s ease-in-out infinite}
@keyframes peek{0%,70%,100%{transform:translateX(120%)}74%,96%{transform:translateX(0)}}

/* ticker strip (filled by live.js); cam and follow badge make room for it */
[hidden]{display:none!important}
.tstrip{position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(17,10,12,.92);display:flex;align-items:center;overflow:hidden;z-index:2}
.tlabel{height:100%;display:flex;align-items:center;padding:0 18px;background:#E8557A;color:#110A0C;font-size:14px;flex:none;position:relative;z-index:1}
.tclip{flex:1;overflow:hidden;white-space:nowrap}
.tk{display:inline-flex;align-items:center;animation:tstrip 30s linear infinite}
.tk span{font-family:Rubik,system-ui,sans-serif;font-weight:700;color:#F4EFE6;padding:0 18px}
.tk i{font-style:normal;font-family:'JetBrains Mono',monospace;font-weight:800;color:#30D5C8}
@keyframes tstrip{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.sc:has(#ticker:not([hidden])) #cam,.sc:has(#ticker:not([hidden])) #follow{margin-bottom:52px}
</style>

<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}.sc{transform-origin:0 0}.follow.fl{animation-name:peekL;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}@keyframes peekL{0%,70%,100%{transform:translateX(-120%)}74%,96%{transform:translateX(0)}}[hidden]{display:none!important}</style>
</head><body>

<div class="sc">
  

  <div id="cam" style="position: absolute; left: 32px; bottom: 32px; width: 480px; display: flex; flex-direction: column">
    <div style="position: relative; width: 480px; height: 270px; background: transparent; display: flex; align-items: center; justify-content: center">
      
      <span class="br" style="top: -4px; left: -4px; border-top-width: 6px; border-left-width: 6px"></span>
      <span class="br" style="top: -4px; right: -4px; border-top-width: 6px; border-right-width: 6px"></span>
      <span class="br" style="bottom: -4px; left: -4px; border-bottom-width: 6px; border-left-width: 6px; border-color: #E8557A"></span>
      <span class="br" style="bottom: -4px; right: -4px; border-bottom-width: 6px; border-right-width: 6px; border-color: #E8557A"></span>
    </div>
    <div style="display: flex; margin-top: 10px; gap: 8px">
      <span class="mono cut-s" style="display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; background: #FF4D4D; color: #110A0C; font-size: 14px"><span class="ld"></span>Live</span>
      <span class="disp cut-s" style="display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; background: #110A0C; font-size: 24px">MAD <span class="mono" style="font-size: 13px; color: #E8557A">P1</span></span>
      <span class="mono cut-s" style="display: inline-flex; align-items: center; height: 40px; padding: 0 14px; background: #800020; font-size: 13px">@madnco8</span>
      <span hidden data-show="game" class="mono" style="display:inline-flex;align-items:center;white-space:nowrap;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);height:40px;padding:0 14px;background:#30D5C8;color:#110A0C;font-size:13px">Now&nbsp;·&nbsp;<span data-text="game"></span></span>
    </div>
  </div>

  <img id="logo" src="/madnco-logo.svg" alt="MadnCo. logo" style="position: absolute; right: 28px; top: 22px; width: 170px; height: auto; opacity: .92">

  <div id="follow" class="follow mono cut" style="position: absolute; right: 0; bottom: 40px; display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 26px 0 22px; background: #30D5C8; color: #110A0C; font-size: 17px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Follow for the next round of madness
  </div>
  <div id="ticker" class="tstrip" hidden data-show="ticker-gaming" aria-hidden="true">
    <span class="mono tlabel">MadnCo.</span>
    <div class="tclip"><div class="tk" data-ticker="gaming"><span style="font-size: 20px">MadnCo.</span><i style="font-size: 16px">//</i></div></div>
  </div>
</div>

<script>(function(){var W=1920,H=1080;function fit(){var s=document.querySelector('.sc');var k=Math.min(innerWidth/W,innerHeight/H);s.style.transform='scale('+k+')';}addEventListener('resize',fit);fit();})();</script>
<script>(function(){
var q=new URLSearchParams(location.search),ok=['bl','br','tl','tr'];
var cam=(q.get('cam')||'bl').toLowerCase(),logo=(q.get('logo')||'').toLowerCase();
if(ok.indexOf(cam)<0)cam='bl';
var c=document.getElementById('cam'),l=document.getElementById('logo'),f=document.getElementById('follow');
function place(el,p,dx,dy){el.style.left=el.style.right=el.style.top=el.style.bottom='auto';
 if(p[1]==='l')el.style.left=dx+'px';else el.style.right=dx+'px';
 if(p[0]==='t')el.style.top=dy+'px';else el.style.bottom=dy+'px';}
place(c,cam,32,32);
if(logo!=='off'){if(ok.indexOf(logo)<0)logo='t'+(cam[1]==='l'?'r':'l');
 if(logo===cam)logo=logo[0]+(logo[1]==='l'?'r':'l');place(l,logo,28,22);}else{l.style.display='none';}
var used=[cam,logo];
if(used.indexOf('br')>=0){if(used.indexOf('bl')<0){f.style.right='auto';f.style.left='0';f.classList.add('fl');}else{f.style.bottom='420px';}}
})();</script>
<script src="/overlay/live.js" defer></script>
</body></html>
