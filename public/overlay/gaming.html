<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MadnCo. · Gaming</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Rubik:wght@400;500;700&amp;family=JetBrains+Mono:wght@700;800&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>
.sc{position:relative;width:1920px;height:1080px;overflow:hidden;color:#F4EFE6;font-family:Rubik,system-ui,sans-serif}
.sc *{box-sizing:border-box}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.disp{font-family:'Lilita One',Rubik,sans-serif;font-weight:400}
.cut{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.cut-s{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.follow{animation:peek 20s ease-in-out infinite}
@keyframes peek{0%,70%,100%{transform:translateX(120%)}74%,96%{transform:translateX(0)}}
[hidden]{display:none!important}

/* Cam + nameplate: one unit in the cam's corner (?cam=bl|br|tl|tr). */
.unit{position:absolute;width:480px;display:flex;flex-direction:column;gap:0}
.unit .poll{margin-bottom:10px;width:480px}
.sc[data-row="t"] .unit{flex-direction:column-reverse}
.sc[data-row="t"] .unit .poll{margin:10px 0 0}
.camb{position:relative;width:480px;height:270px;outline:3px solid var(--a);outline-offset:-3px}
.sc[data-row="b"] .np{border-top:4px solid var(--a)}
.sc[data-row="t"] .np{border-bottom:4px solid var(--a)}
/* Clean mode: between pop-ups only the counter shows (the stream title has
   the rest). Every ?every= minutes (default 20) the full nameplate slides
   out for ?show= seconds (default 20); also when the scene comes on screen
   and when the goal, part or Co changes. ?clean=0 keeps it full. */
.np{transition:max-width .55s cubic-bezier(.22,1,.36,1),opacity .35s ease;max-width:480px}
.np-meta{transition:opacity .3s ease,max-width .55s cubic-bezier(.22,1,.36,1);max-width:440px;white-space:normal}
.np-more{display:grid;grid-template-rows:1fr;transition:grid-template-rows .55s cubic-bezier(.22,1,.36,1),opacity .3s ease}
.np-more>div{overflow:hidden;min-height:0}
.sc[data-col="l"] .np{align-self:flex-start}
.sc[data-col="r"] .np{align-self:flex-end}
.sc.compact .np-meta{opacity:0;max-width:0;overflow:hidden;white-space:nowrap}
.sc.compact .np-top{gap:0}
.sc.compact .np-more{grid-template-rows:0fr;opacity:0}
.sc.compact .np{gap:0}
.sc.compact.nostat .np{opacity:0}
@media (prefers-reduced-motion:reduce){.np,.np-meta,.np-more{transition:none}}


/* ticker strip (filled by live.js; off by default): the unit makes room */
.tstrip{position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(17,10,12,.92);display:flex;align-items:center;overflow:hidden;z-index:2}
.tlabel{height:100%;display:flex;align-items:center;padding:0 18px;background:#E8557A;color:#110A0C;font-size:14px;flex:none;position:relative;z-index:1}
.tclip{flex:1;overflow:hidden;white-space:nowrap}
.tk{display:inline-flex;align-items:center;animation:tstrip 30s linear infinite}
.tk span{font-family:Rubik,system-ui,sans-serif;font-weight:700;color:#F4EFE6;padding:0 18px}
.tk i{font-style:normal;font-family:'JetBrains Mono',monospace;font-weight:800;color:#30D5C8}
@keyframes tstrip{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.sc[data-row="b"]:has(#ticker:not([hidden])) #unit,.sc:has(#ticker:not([hidden])) #follow{margin-bottom:52px}
</style>

<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}.sc{transform-origin:0 0}.follow.fl{animation-name:peekL;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}@keyframes peekL{0%,70%,100%{transform:translateX(-120%)}74%,96%{transform:translateX(0)}}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="/overlay/play.css">
<link rel="stylesheet" href="/overlay/plate.css">
<link rel="stylesheet" href="/overlay/guest.css">
<link rel="stylesheet" href="/overlay/alerts.css">
</head><body>

<div class="sc" data-row="b">

  <div id="unit" class="unit" style="left: 32px; bottom: 32px">
    <div class="poll cut" hidden data-show="play-poll">
      <div class="h mono"><span>Chat decides · type !1 !2</span><span data-text="poll-votes">0 votes</span></div>
      <div class="q disp" data-text="poll-q"></div>
      <div class="opts">
        <div class="o" hidden data-show="poll-o1" data-lead="1"><div class="f" data-bar="poll-1"></div><span class="mono" data-text="poll-t1"></span></div>
        <div class="o" hidden data-show="poll-o2" data-lead="2"><div class="f" data-bar="poll-2"></div><span class="mono" data-text="poll-t2"></span></div>
        <div class="o" hidden data-show="poll-o3" data-lead="3"><div class="f" data-bar="poll-3"></div><span class="mono" data-text="poll-t3"></span></div>
        <div class="o" hidden data-show="poll-o4" data-lead="4"><div class="f" data-bar="poll-4"></div><span class="mono" data-text="poll-t4"></span></div>
      </div>
    </div>

    <div class="np" hidden data-show="play">
      <div class="np-top">
        <div class="np-meta mono">
          <span class="mi" hidden data-show="play-sub-on" data-text="play-short"></span>
          <span class="mi" hidden data-show="play-part"><span data-text="play-unit"></span> <b data-text="play-part-n"></b></span>
          <span class="co" hidden data-show="co">w/ <span data-text="co-name"></span></span>
          <span class="fin" hidden data-show="play-final">Final</span>
        </div>
        <div class="np-stat">
          <div class="ct" hidden data-show="play-c1-on">
            <span class="skw" hidden data-show="play-c1-skull"><svg class="sk" viewBox="0 0 24 24" aria-hidden="true"><path class="b" d="M12 2C7 2 3.5 5.6 3.5 10.2c0 2.6 1.1 4.4 2.7 5.6V19c0 .8.6 1.4 1.4 1.4h1.1v-2h1.5v2h3.6v-2h1.5v2h1.1c.8 0 1.4-.6 1.4-1.4v-3.2c1.6-1.2 2.7-3 2.7-5.6C20.5 5.6 17 2 12 2z"/><circle cx="8.8" cy="10.6" r="2.3" fill="#110A0C"/><circle cx="15.2" cy="10.6" r="2.3" fill="#110A0C"/><path d="M12 13.2l-1.3 2.2h2.6z" fill="#110A0C"/></svg></span>
            <span class="lb mono" hidden data-show="play-c1-named" data-text="play-c1-label"></span>
            <b data-text="play-c1-n" data-pop>0</b><small data-text="play-c1-of"></small>
          </div>
          <div class="ct two" hidden data-show="play-c2-on">
            <span class="lb mono" data-text="play-c2-label"></span>
            <b data-text="play-c2-n" data-pop>0</b><small data-text="play-c2-of"></small>
          </div>
          <div class="fbs" hidden data-show="play-football">
            <span class="r" hidden data-show="fb-record-on"><span class="mono" style="color: var(--a)">W</span><b data-text="fb-w" data-pop>0</b></span>
            <span class="r" hidden data-show="fb-record-on"><span class="mono" style="color: #BBAAB1">D</span><b data-text="fb-d" data-pop>0</b></span>
            <span class="r" hidden data-show="fb-record-on"><span class="mono" style="color: var(--b)">L</span><b data-text="fb-l" data-pop>0</b></span>
            <span class="gl" hidden data-show="fb-goals-on" data-text="fb-goals">0:0</span>
          </div>
        </div>
      </div>
      <div class="np-more"><div><div class="np-head" hidden data-show="play-head-on" data-text="play-head"></div></div></div>
    </div>

    <div class="np" hidden data-show="game-only">
      <div class="np-top"><div class="np-meta mono"><span class="mi">Now playing</span><span class="co" hidden data-show="co">w/ <span data-text="co-name"></span></span></div></div>
      <div class="np-more"><div><div class="np-head" data-text="game"></div></div></div>
    </div>

    <div id="cam" class="camb"><span class="camfx"></span><span class="rec mono">● REC</span></div>
  </div>

  <img id="logo" src="/overlay/logo-flat.png" alt="MadnCo. logo" style="position: absolute; right: 28px; top: 22px; width: 110px; height: auto; opacity: .6">

  <div id="follow" data-hide="guest" class="follow mono cut" style="position: absolute; right: 0; bottom: 40px; display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 26px 0 22px; background: #30D5C8; color: #110A0C; font-size: 17px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Follow for the next round of madness
  </div>
  <div id="gtag" class="gtag mono cut-s" hidden data-show="guest"><i></i>Guest on <span data-text="guest-host"></span></div>
  <div id="homecard" class="homecard cut" hidden data-show="home-card">
    <span class="k mono">You found MadnCo. on a borrowed channel</span>
    <span class="t disp">Our home is <span style="color: #30D5C8">@madnco8</span>. Follow us there.</span>
    <div class="row"><span class="p mono cut-s">YouTube</span><span class="p mono cut-s">Twitch</span><span class="p mono cut-s">TikTok</span>
      <span class="mono" style="margin-left: auto; font-size: 12px; color: #BBAAB1">TikTok LIVE <b style="color: #30D5C8" data-text="quest-followers">?</b> / <span data-text="quest-goal">50</span></span></div>
  </div>
  <div id="ticker" class="tstrip" hidden data-show="ticker-gaming" aria-hidden="true">
    <span class="mono tlabel" data-text="ticker-label">MadnCo.</span>
    <div class="tclip"><div class="tk" data-ticker="gaming"><span style="font-size: 20px">MadnCo.</span><i style="font-size: 16px">//</i></div></div>
  </div>
  <div id="alert-lane" class="alane" aria-live="polite" style="left: 580px; top: 28px; width: 760px"></div>
</div>

<script>(function(){var W=1920,H=1080;function fit(){var s=document.querySelector('.sc');var k=Math.min(innerWidth/W,innerHeight/H);s.style.transform='scale('+k+')';}addEventListener('resize',fit);fit();})();</script>
<script>(function(){
// ?cam=bl|br|tl|tr (one browser source per OBS Gaming scene). The
// nameplate rides with the cam: above it at the bottom, below it at the top.
var q=new URLSearchParams(location.search),ok=['bl','br','tl','tr'];
var cam=(q.get('cam')||'bl').toLowerCase(),logo=(q.get('logo')||'').toLowerCase();
if(ok.indexOf(cam)<0)cam='bl';
var sc=document.querySelector('.sc');sc.setAttribute('data-row',cam[0]);
var u=document.getElementById('unit'),l=document.getElementById('logo'),f=document.getElementById('follow');
function place(el,p,dx,dy){el.style.left=el.style.right=el.style.top=el.style.bottom='auto';
 if(p[1]==='l')el.style.left=dx+'px';else el.style.right=dx+'px';
 if(p[0]==='t')el.style.top=dy+'px';else el.style.bottom=dy+'px';}
place(u,cam,32,32);
var g=document.getElementById('gtag'),h=document.getElementById('homecard');
// Logo: the top corner across from the cam.
if(logo!=='off'){if(ok.indexOf(logo)<0)logo='t'+(cam[1]==='l'?'r':'l');
 if(logo===cam)logo=logo[0]+(logo[1]==='l'?'r':'l');place(l,logo,28,22);place(g,logo,30,logo[0]==='t'?92:150);}else{l.style.display='none';place(g,'t'+(cam[1]==='l'?'r':'l'),30,28);}
var used=[cam,logo];
if(used.indexOf('br')>=0){if(used.indexOf('bl')<0){f.style.right='auto';f.style.left='0';f.classList.add('fl');h.style.right='auto';h.style.left='0';h.classList.add('fl');}else{f.style.bottom='460px';h.style.bottom='460px';}}
// Alert lane: along the top, clear of a top cam.
var lane=document.getElementById('alert-lane');
if(cam==='tr'){lane.style.left='auto';lane.style.right='560px';}
else if(cam==='tl'){lane.style.left='560px';}
else{lane.style.left='580px';}
})();</script>
<script>(function(){
// Clean mode (see the CSS note above).
var q=new URLSearchParams(location.search);
if(q.get('clean')==='0')return;
var sc=document.querySelector('.sc');
var every=Math.max(1,Number(q.get('every'))||20)*60000,show=Math.max(5,Number(q.get('show'))||20)*1000;
sc.setAttribute('data-col',((q.get('cam')||'bl')[1]==='r')?'r':'l');
var timer=null;
function plates(){return Array.prototype.filter.call(document.querySelectorAll('#unit .np'),function(n){return !n.hidden;});}
function squeeze(){
 var any=false;
 plates().forEach(function(n){var st=n.querySelector('.np-stat');var w=st?st.offsetWidth:0;
  if(w){any=true;n.style.maxWidth=(w+36)+'px';}});
 sc.classList.toggle('nostat',!any);
 sc.classList.add('compact');
}
function full(){
 clearTimeout(timer);
 sc.classList.remove('compact');
 plates().forEach(function(n){n.style.maxWidth='';});
 timer=setTimeout(squeeze,show);
}
window.MadnFull=full;
full();
setInterval(full,every);
addEventListener('obsSourceVisibleChanged',function(e){if(!(e&&e.detail&&e.detail.visible===false))full();});
// New goal, part or Co: show the full plate once.
if(window.MutationObserver){var mo=new MutationObserver(function(){if(sc.classList.contains('compact'))full();});
 ['play-head','play-part-n','co-name','game'].forEach(function(k){Array.prototype.forEach.call(document.querySelectorAll('#unit [data-text="'+k+'"]'),function(el){mo.observe(el,{childList:true,characterData:true,subtree:true});});});}
// Counters and scores change width: re-fit the compact plate.
if(window.MutationObserver){var mo2=new MutationObserver(function(){if(sc.classList.contains('compact'))squeeze();});
 Array.prototype.forEach.call(document.querySelectorAll('#unit .np-stat'),function(el){mo2.observe(el,{childList:true,characterData:true,subtree:true,attributes:true,attributeFilter:['hidden']});});}
})();</script>
<script src="/overlay/live.js" defer></script>
</body></html>
