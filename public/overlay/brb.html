<style>

.sc{position:relative;width:1920px;height:1080px;overflow:hidden;background:#110A0C;color:#F4EFE6;font-family:Rubik,system-ui,sans-serif}
.sc *{box-sizing:border-box}
.stripes{position:absolute;inset:0;background-image:repeating-linear-gradient(-45deg,rgba(128,0,32,.18) 0 2px,transparent 2px 26px)}
.scan{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(244,239,230,.03) 0 2px,transparent 2px 5px);pointer-events:none}
.glow{position:absolute;border-radius:50%}
.g1{left:-200px;top:120px;width:1100px;height:1100px;background:radial-gradient(circle,rgba(48,213,200,.22) 0%,transparent 62%);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.1);opacity:1}}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.disp{font-family:'Lilita One',Rubik,sans-serif;font-weight:400}
.cut{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.cut-s{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.big{text-shadow:-8px 0 0 #800020,8px 0 0 #30D5C8;animation:glitch 5s steps(1) infinite}
@keyframes glitch{0%,88%,100%{text-shadow:-8px 0 0 #800020,8px 0 0 #30D5C8;transform:none}90%{text-shadow:12px 0 0 #800020,-12px 0 0 #30D5C8;transform:translate(5px,-2px) skewX(-6deg)}92%{text-shadow:-16px 0 0 #800020,16px 0 0 #30D5C8;transform:translate(-6px,2px)}94%{text-shadow:-8px 0 0 #800020,8px 0 0 #30D5C8;transform:none}}
.ghost{animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(-14px) rotate(4deg)}50%{transform:translateY(16px) rotate(-3deg)}}
.shadow{animation:shad 3.4s ease-in-out infinite}
@keyframes shad{0%,100%{transform:scaleX(.8);opacity:.35}50%{transform:scaleX(1);opacity:.6}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.tape{position:absolute;left:-80px;right:-80px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.track{display:inline-flex;animation:tick 34s linear infinite}
.track span{font-family:'Lilita One',sans-serif;padding:0 24px}
.track i{font-style:normal;font-family:'JetBrains Mono',monospace;font-weight:800;opacity:.55}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.br{position:absolute;width:56px;height:56px;border:0 solid #30D5C8}

/* side quest card + BRB extras (filled by live.js) */
.qbar{height:20px;background:#26161C;padding:4px}
.qfill{display:block;height:100%;width:2%;background:repeating-linear-gradient(90deg,#30D5C8 0 18px,#23A99E 18px 23px);transition:width .6s}
.cdchip{display:inline-flex;align-items:center;gap:16px;padding:0 22px;background:var(--a);color:var(--lab)}
[hidden]{display:none!important}
</style>
